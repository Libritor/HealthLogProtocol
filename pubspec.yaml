name: healthlog
description: Health logging app with Muse headband EEG and Oura Ring biometric data collection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Bluetooth Low Energy
  flutter_blue_plus: ^1.31.0
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  
  # CSV Processing
  csv: ^6.0.0
  
  # File System & Storage
  path_provider: ^2.1.0
  
  # Sharing
  share_plus: ^7.2.0
  
  # OSC Streaming
  osc: ^1.0.0

  
  # Permissions
  permission_handler: ^11.0.1
  
  # Utilities
  intl: ^0.19.0
  
  # File Picker
  file_picker: ^8.0.0

  # Video Thumbnails
  video_thumbnail: ^0.5.3
  
  # HTTP Client
  http: ^1.1.0

  # Persistent key-value storage (Oura token, preferences)
  shared_preferences: ^2.2.2
  
  # Text-to-Speech for AI voice feedback
  flutter_tts: ^3.8.5
  
  # UUID for unique session IDs
  uuid: ^4.2.1

  # Camera for synchronized video recording
  camera: ^0.11.0+2

  # Cryptography (hashing, encryption)
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  encrypt: ^5.0.3

  # Secure storage (encryption keys only -- never use shared_preferences for keys)
  flutter_secure_storage: ^9.0.0

  # URL launcher (Solana Explorer links)
  url_launcher: ^6.2.0

  # Solana RPC client (devnet memo transactions)
  solana: ^0.31.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/

